meta:
  theme: tech-blue
  profile: engineering-review
  layout: vertical
  canvas: auto
  routing: orthogonal
  title: Search Capability — Ingestion Pipeline
  description: Python pipeline for processing markdown files into the suggestions index

modules:
  - id: input
    label: Input
  - id: chunking
    label: Chunking
  - id: keyword_extraction
    label: Keyword Extraction
  - id: question_generation
    label: Question Generation
  - id: embedding
    label: Embedding
  - id: data_store
    label: Data Store

nodes:
  # Input
  - id: markdown_files
    label: "Markdown Files\n(title + section + body)"
    type: document
    module: input
    size: large
    position:
      x: 320
      y: 40

  # Chunking
  - id: chunker
    label: "Section Chunker\n(title + section + body per chunk)"
    type: process
    module: chunking
    size: xl
    position:
      x: 280
      y: 200

  # Keyword Extraction — structural (always)
  - id: structural_keywords
    label: "Structural Extraction\n(titles + section headers)"
    type: process
    module: keyword_extraction
    size: large
    position:
      x: 40
      y: 400

  # Keyword Extraction — Option A
  - id: azure_lang
    label: "Option A\nAzure AI Language\n(key phrases from body)"
    type: service
    module: keyword_extraction
    size: large
    position:
      x: 40
      y: 540

  # Keyword Extraction — Option B
  - id: llm_keywords
    label: "Option B\nLLM Keyword Extraction\n(via question gen prompt)"
    type: service
    module: keyword_extraction
    size: large
    position:
      x: 40
      y: 680

  - id: keyword_merge
    label: Merge Keywords
    type: process
    module: keyword_extraction
    size: medium
    position:
      x: 80
      y: 820

  # Question Generation
  - id: azure_oai_questions
    label: "Azure OpenAI\nGPT-4o\nQuestion Generation"
    type: service
    module: question_generation
    size: large
    position:
      x: 520
      y: 540

  # Embedding
  - id: azure_oai_embed
    label: "Azure OpenAI\nEmbedding Generation\n(text-embedding-3-small)"
    type: service
    module: embedding
    size: large
    position:
      x: 300
      y: 980

  # Data Store — generic, backend TBD
  - id: data_source
    label: "Data Source\n{ id, text, type, embedding }"
    type: database
    module: data_store
    size: large
    position:
      x: 300
      y: 1140

edges:
  # Markdown → Chunker
  - from: markdown_files
    to: chunker
    type: primary

  # Chunker → Structural keywords (always)
  - from: chunker
    to: structural_keywords
    type: primary
    label: titles + headers

  # Chunker → Azure AI Language (Option A)
  - from: chunker
    to: azure_lang
    type: optional
    label: "Option A: body text"

  # Chunker → LLM keywords (Option B)
  - from: chunker
    to: llm_keywords
    type: optional
    label: "Option B: body text"

  # Chunker → Question generation
  - from: chunker
    to: azure_oai_questions
    type: primary
    label: title + section + body

  # Keyword paths → merge
  - from: structural_keywords
    to: keyword_merge
    type: primary

  - from: azure_lang
    to: keyword_merge
    type: optional

  - from: llm_keywords
    to: keyword_merge
    type: optional

  # Merge → Embedding
  - from: keyword_merge
    to: azure_oai_embed
    type: primary
    label: keywords

  # Questions → Embedding
  - from: azure_oai_questions
    to: azure_oai_embed
    type: primary
    label: questions

  # Embedding → Data Source
  - from: azure_oai_embed
    to: data_source
    type: data
    label: "{ text, type, embedding }"
